services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      FIELD_SHIFT_DB: /var/lib/field-shift/field_shift.db
      FIELD_SHIFT_LAYER_DIR: /var/lib/field-shift/layers
    volumes:
      - field-shift-data:/var/lib/field-shift
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  field-shift-data:
